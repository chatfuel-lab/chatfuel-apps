version: 2
updates:
  # The only npm dependency is the validator's ajv; one grouped PR a week is plenty.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: development
        patterns: ['*']
    commit-message:
      prefix: 'deps-dev'
    labels: ['dependencies']

  # Actions are pinned by commit sha, which no human is going to bump by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
    labels: ['dependencies']
